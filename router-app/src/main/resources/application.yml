server:
  undertow:
    buffer-size: 1024
    direct-buffers: true
    threads:
      io: 4
      worker: 32
  #  servlet:
  #    context-path: /${spring.application.name}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  application:
    name: dows-hrm
    appId: 1
  profiles:
    include: mysql,mybatis,caffeine,ai,thread,oss,debezium,trigger,rade
    active: dev

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB





# Swagger配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: 路由器API文档
    description: 路由器系统API接口文档
    version: 1.0.0
    contact:
      name: lait.zhang
      email: lait.zhang@gmail.com

# 日志配置
logging:
  level:
    root: info
    org.springframework.web.client: DEBUG
    org.dows.router: DEBUG
    com.mybatisflex: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"